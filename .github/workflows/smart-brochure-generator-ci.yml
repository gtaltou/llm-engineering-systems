name: Smart Brochure Generator CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/**"
      - "projects/01-smart-brochure-generator/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/**"
      - "projects/01-smart-brochure-generator/**"

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/01-smart-brochure-generator

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Dependencies
        run: uv sync

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Ruff Lint
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy .

      - name: Pytest + Coverage
        run: uv run pytest -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: smart-brochure-generator-coverage
          path: projects/01-smart-brochure-generator/coverage.xml